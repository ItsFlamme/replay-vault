name: Release

# Push a tag like v0.1.0 (matching Cargo.toml). This builds the exe, portable zip, installer,
# SBOM and SHA256SUMS.txt, and opens a DRAFT release with them. Nothing is public until
# the draft is published by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Tools
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          cargo install cargo-cyclonedx --locked
          # Inno Setup 6.7.4 from its own GitHub release, checked against its publisher's signature.
          $is = "$env:RUNNER_TEMP\innosetup-6.7.4.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe -OutFile $is
          $sig = Get-AuthenticodeSignature $is
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Pyrsys B\.V\.') { throw 'Inno Setup signature check failed' }
          Start-Process $is -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/SP-' -Wait

      - name: Tests
        shell: pwsh
        run: cargo test --release --locked

      - name: Build release
        shell: pwsh
        run: ./tools/release.ps1

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## \[?$([regex]::Escape($ver))\]?.*?\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Replay Vault $ver" }
          $notes += "`n`nCheck a download with ``Get-FileHash <file>`` against SHA256SUMS.txt."
          Set-Content notes.md $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME --draft --title "Replay Vault $ver" --notes-file notes.md (Get-ChildItem dist -File).FullName
