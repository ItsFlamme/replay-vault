name: Issue to Discord

on:
  issues:
    types: [opened, reopened]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post issue to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_ISSUES_WEBHOOK }}
          ACTION: ${{ github.event.action }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_URL: ${{ github.event.issue.user.html_url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_ISSUES_WEBHOOK is not set, skipping."
            exit 0
          fi
          payload=$(jq -n \
            --arg action "$ACTION" \
            --arg title "$ISSUE_TITLE" \
            --arg url "$ISSUE_URL" \
            --arg number "$ISSUE_NUMBER" \
            --arg author "$ISSUE_AUTHOR" \
            --arg author_url "$ISSUE_AUTHOR_URL" \
            --arg body "$ISSUE_BODY" \
            '{
              username: "Replay Vault Issues",
              thread_name: ((if $action == "reopened" then "Reopened #" else "Issue #" end) + $number + ": " + $title)[0:100],
              allowed_mentions: { parse: [] },
              embeds: [{
                title: ("#" + $number + " " + $title)[0:256],
                url: $url,
                author: { name: ($author + " " + $action + " an issue"), url: $author_url },
                description: (if ($body | length) > 1000 then $body[0:1000] + "..." elif ($body | length) == 0 then "(no description)" else $body end),
                color: (if $action == "reopened" then 15105570 else 3066993 end)
              }]
            }')
          curl -fsS --retry 2 -H "Content-Type: application/json" -d "$payload" "$WEBHOOK" > /dev/null
