[package]
name = "replay-vault"
version = "0.2.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.37"
futures-util = "0.3.34"
gif = "0.14.2"
# Steam's game covers (covers.rs) are JPEGs.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
obws = { version = "0.15", features = ["events"] }
raw-window-handle = "0.6"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time"] }
tray-icon = "0.26.1"
ureq = "3.5.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_System_Variant", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_Security_Authorization", "Win32_System_SystemInformation", "Win32_Graphics_Dxgi", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_Media_MediaFoundation", "Win32_Storage_FileSystem", "Win32_System_Time", "Win32_Security_Cryptography", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Dwm", "Win32_Devices_Display", "Win32_Graphics_Dxgi_Common", "Win32_System_SystemServices", "Win32_UI_Shell_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12"] }
# The #[implement] macro (player.rs's Media Engine callback) expands to ::windows_core paths.
windows-core = "0.62"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot", "eframe"] }
# Saves the off-screen toast render (toast.rs tests) as a PNG.
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
# Compiles the exe's version info (product name, version) into it; see build.rs.
embed-resource = "3.0.12"
